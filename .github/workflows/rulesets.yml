name: Validate Rulesets

on:
  push:
    branches: [main]
    paths:
      - 'WPTechnix/**'
      - 'WPTechnix-PSR4/**'
      - 'WPTechnix-PSR/**'
      - 'WPTechnix-Strict/**'
      - 'tests/fixtures/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/rulesets.yml'
  pull_request:
    paths:
      - 'WPTechnix/**'
      - 'WPTechnix-PSR4/**'
      - 'WPTechnix-PSR/**'
      - 'WPTechnix-Strict/**'
      - 'tests/fixtures/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/rulesets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check ruleset XML is well-formed
        run: php -r "foreach (glob('WPTechnix*/ruleset.xml') as \$f) { simplexml_load_file(\$f) or exit(1); }"

      - name: List registered standards
        run: composer list-standards

      - name: Validate each standard resolves (standalone and combined)
        run: composer validate-rulesets

      - name: Lint style fixtures
        run: composer lint:fixtures
